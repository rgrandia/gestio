name: copia

# Cada dilluns, si hi ha els secrets (README, «Còpies de seguretat»):
#   1. passa la verificació a la base de dades de producció (no hi deixa res);
#   2. fa una còpia de l'esquema public;
#   3. la restaura en una base de dades buida i comprova que hi ha les mateixes
#      files que a l'original;
#   4. la desa xifrada (AES-256) 90 dies com a artefacte.
# Si qualsevol pas falla, el workflow surt en vermell i GitHub us avisa per correu.
#
# Secrets: SUPABASE_DB_URL (obligatori), COPIA_CONTRASENYA (per desar la còpia).

on:
  schedule:
    - cron: "17 5 * * 1" # dilluns a les 5.17 UTC
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    services:
      # base de dades d'usar i llençar per provar la restauració
      restauracio:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: proves
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONTRASENYA: ${{ secrets.COPIA_CONTRASENYA }}
      DESTI: postgres://postgres:proves@127.0.0.1:5433/postgres
    steps:
      - name: Hi ha secrets?
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Sense SUPABASE_DB_URL no es verifica ni es copia res."
            echo "hi_es=false" >> "$GITHUB_OUTPUT"
          else
            echo "hi_es=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secret.outputs.hi_es == 'true'
      - name: Client de Postgres 17 (pg_dump ha de ser igual o més nou que el servidor)
        if: steps.secret.outputs.hi_es == 'true'
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verificació de producció (CLAUDE.md §7.3; tot es desfà en acabar)
        if: steps.secret.outputs.hi_es == 'true'
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/verificacio.sql
          node scripts/comprova-requerit.mjs | psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f -
      - name: Còpia
        if: steps.secret.outputs.hi_es == 'true'
        run: |
          echo "NOM=gestio-$(date -u +%F)" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f copia.dump
      - name: Prova de restauració
        if: steps.secret.outputs.hi_es == 'true'
        run: ORIGEN="$DATABASE_URL" scripts/prova-restauracio.sh copia.dump
      - name: Xifra la còpia
        if: steps.secret.outputs.hi_es == 'true' && env.CONTRASENYA != ''
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            -o "$NOM.dump.gpg" copia.dump 3<<<"$CONTRASENYA"
      - name: Esborra la còpia sense xifrar
        if: always()
        run: rm -f copia.dump
      - uses: actions/upload-artifact@v6
        if: steps.secret.outputs.hi_es == 'true' && env.CONTRASENYA != ''
        with:
          name: ${{ env.NOM }}
          path: ${{ env.NOM }}.dump.gpg
          retention-days: 90

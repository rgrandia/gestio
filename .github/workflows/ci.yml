name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Dates en català de l'alta ràpida
        run: node --experimental-strip-types scripts/prova-dates.mts
      - run: npm run build
        env:
          GESTIO_SUPABASE_URL: http://127.0.0.1:54321
          GESTIO_SUPABASE_ANON_KEY: ci

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: La versió que espera l'app és la darrera migració, i cada migració es registra
        run: scripts/comprova-migracions.sh
      - name: Migracions + verificació RLS/triggers/vistes (CLAUDE.md §7.3)
        run: scripts/prova-sql.sh

  # Proves de punta a punta amb un navegador contra un Supabase mínim
  # (Postgres + GoTrue + PostgREST, sense Docker): scripts/e2e/entorn.sh.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DIR: /tmp/gestio-e2e
      E2E_CAPTURES: /tmp/gestio-e2e/captures
      DB_PROVES: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: e2e
      - name: Navegador
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Supabase mínim i usuaris de prova
        run: scripts/e2e/entorn.sh
      - name: Compila i arrenca l'app
        run: |
          export GESTIO_SUPABASE_URL=http://127.0.0.1:54321
          export GESTIO_SUPABASE_ANON_KEY=$(cat "$E2E_DIR/anon.key")
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3000 > "$E2E_DIR/next.log" 2>&1 < /dev/null &
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 1; done
          echo "l'app no arrenca" >&2; exit 1
      - name: Recorregut bàsic (base de dades buida)
        run: node basic.mjs
        working-directory: e2e
      - name: Dades de prova
        run: psql "$DB_PROVES" -X -q -v ON_ERROR_STOP=1 -f e2e/dades-prova.sql
      - name: Edició, reobrir, fases noves, revisions, nova onada i resum
        run: node funcions.mjs
        working-directory: e2e
      - name: Dades de prova de nou (xarxes parteix de zero)
        run: psql "$DB_PROVES" -X -q -v ON_ERROR_STOP=1 -f e2e/dades-prova.sql
      - name: Xarxes socials
        run: node xarxes.mjs
        working-directory: e2e
      - name: Dades de prova de nou (calendari)
        run: psql "$DB_PROVES" -X -q -v ON_ERROR_STOP=1 -f e2e/dades-prova.sql
      - name: Calendari de l'inici i el meu calendari
        run: node calendari.mjs
        working-directory: e2e
      - name: Verificació sobre dades com les de producció
        # migracions.yml l'executa contra producció: no pot dependre d'una base buida
        run: psql "$DB_PROVES" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/verificacio.sql
      - name: Captures i registres
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-captures
          path: |
            /tmp/gestio-e2e/captures
            /tmp/gestio-e2e/*.log
          retention-days: 7
